# Local environment. `docker compose up -d --build` runs PostgreSQL and the API;
# `docker compose up -d postgres` runs only the database for `dotnet run`.
name: taskflow

services:
  postgres:
    image: postgres:16-alpine
    container_name: taskflow-postgres
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
    # Host port 5433 avoids clashing with a local PostgreSQL on 5432.
    ports:
      - "5433:5432"
    volumes:
      - taskflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: taskflow-api
    depends_on:
      postgres:
        condition: service_healthy
    # Development enables Swagger UI and applies migrations at startup; meant for local use only.
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=taskflow;Username=taskflow;Password=taskflow
    ports:
      - "8080:8080"

volumes:
  taskflow-data:
