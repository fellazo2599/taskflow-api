name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TaskFlow.slnx

      - name: Check formatting
        run: dotnet format TaskFlow.slnx --verify-no-changes --no-restore --exclude src/TaskFlow.Infrastructure/Persistence/Migrations

      - name: Build
        run: dotnet build TaskFlow.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test TaskFlow.slnx --configuration Release --no-build

      - name: Build Docker image
        run: docker build --tag taskflow-api:ci .
